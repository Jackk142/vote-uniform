<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>โหวตชุดแต่งกายประจำปี</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }

    /* ความกว้างการ์ด 9:16 — 290px = พื้นที่เผื่อให้หัวเว็บ + หัวข้อรางวัล + ปุ่ม */
    :root { --card-w: max(170px, min(86vw, 412px, calc((100vh - 290px) * 9 / 16))); }
    @supports (height: 100dvh) {
      :root { --card-w: max(170px, min(86vw, 412px, calc((100dvh - 290px) * 9 / 16))); }
    }

    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
    .container {
      max-width: 480px; min-height: 100vh; margin: 0 auto; background: #fff;
      padding: 10px 12px 12px; display: flex; flex-direction: column;
    }
    @media (min-width: 520px) {
      body { padding: 16px; }
      .container { min-height: auto; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    }
    h1 { color: #06C755; text-align: center; font-size: 20px; margin: 2px 0; }
    .subtitle { text-align: center; color: #777; font-size: 13px; margin: 0 0 6px; }
    #user-info {
      background: #f1f3f5; border-radius: 10px; padding: 7px; text-align: center;
      font-weight: bold; font-size: 14px; margin-bottom: 6px;
    }

    /* ===== แถบขั้นตอน + หัวข้อรางวัล ===== */
    .stepper { display: flex; gap: 4px; margin: 2px 0 6px; }
    .step-seg { flex: 1; height: 5px; border-radius: 3px; background: #e1e5e9; transition: .25s; }
    .step-seg.done { background: #9be3b8; }
    .step-seg.current { background: #06C755; }
    .category-box { text-align: center; margin-bottom: 2px; }
    .category-step { font-size: 12px; color: #888; }
    .category-title { font-size: 18px; font-weight: bold; color: #333; margin: 2px 0 0; }

    /* ===== Carousel ===== */
    .carousel-wrap { position: relative; margin: 0 -12px; }
    .carousel {
      position: relative; display: flex; gap: 10px;
      overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 6px calc((100% - var(--card-w)) / 2);
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    .vote-card {
      flex: 0 0 var(--card-w); position: relative; scroll-snap-align: center;
      border: 3px solid transparent; border-radius: 18px; overflow: hidden;
      background: #e9ecef; cursor: pointer; opacity: .45; transform: scale(.92);
      transition: transform .25s, opacity .25s, border-color .25s, box-shadow .25s;
    }
    .vote-card.active {
      border-color: #06C755; opacity: 1; transform: scale(1);
      box-shadow: 0 6px 18px rgba(6,199,85,.25);
    }
    .vote-img {
      width: 100%; aspect-ratio: 9 / 16;
      object-fit: cover;   /* ไม่อยากให้รูปโดนตัดขอบ เปลี่ยนเป็น contain */
      display: block; background: #e9ecef;
    }
    .vote-name {
      position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
      padding: 48px 12px 14px; color: #fff; font-size: 18px; text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
      background: linear-gradient(transparent, rgba(0,0,0,.75));
    }
    .vote-badge {
      position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.55); color: #fff;
      font-size: 12px; padding: 3px 9px; border-radius: 20px;
    }
    .vote-card.active::after {
      content: "✓ เลือกอยู่"; position: absolute; top: 10px; left: 10px;
      background: #06C755; color: #fff; font-size: 12px; font-weight: bold;
      padding: 3px 10px; border-radius: 20px;
    }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(0,0,0,.25);
      font-size: 22px; line-height: 38px; color: #06C755; cursor: pointer; z-index: 2; padding: 0;
    }
    .nav-btn:disabled { opacity: 0; pointer-events: none; }
    #prev-btn { left: 6px; }
    #next-btn { right: 6px; }

    .dots { display: flex; justify-content: center; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d0d5da; cursor: pointer; transition: .2s; }
    .dot.active { background: #06C755; width: 20px; border-radius: 4px; }

    /* ===== ปุ่ม ===== */
    .action-row { position: sticky; bottom: 10px; display: flex; gap: 8px; }
    .btn { padding: 14px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .btn-primary { flex: 1; background: #06C755; color: #fff; box-shadow: 0 4px 12px rgba(6,199,85,.3); }
    .btn-secondary { background: #eef1f4; color: #555; padding: 14px 16px; }
    .btn:disabled { background: #ccc; color: #fff; box-shadow: none; }

    /* ===== หน้าสรุป ===== */
    .summary-head { text-align: center; font-size: 18px; font-weight: bold; color: #333; margin: 6px 0 10px; }
    .summary-item {
      display: flex; align-items: center; gap: 12px; padding: 10px;
      border: 1px solid #e9ecef; border-radius: 12px; margin-bottom: 8px;
    }
    .summary-thumb {
      width: 54px; aspect-ratio: 9 / 16; object-fit: cover;
      border-radius: 8px; background: #e9ecef; flex-shrink: 0;
    }
    .summary-text { flex: 1; min-width: 0; }
    .summary-cat { font-size: 12px; color: #888; }
    .summary-choice { font-size: 16px; font-weight: bold; color: #333; margin-top: 2px; }
    .edit-btn {
      background: none; border: 1px solid #06C755; color: #06C755;
      border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    #submit-btn { width: 100%; position: sticky; bottom: 10px; margin-top: 4px; }

    #result { text-align: center; font-size: 18px; margin-top: 16px; font-weight: bold; }
    #debug { color: red; font-size: 12px; white-space: pre-wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 โหวตชุดแต่งกายประจำปี</h1>
    <p class="subtitle">👈 ปัดซ้าย-ขวาเพื่อเลือกชุด แล้วกดถัดไปจนครบทุกรางวัล 👉</p>
    <div id="user-info">กำลังเชื่อมต่อระบบ LINE...</div>

    <div id="vote-section">
      <!-- หน้าเลือกทีละรางวัล -->
      <div id="step-section">
        <div class="stepper" id="stepper"></div>
        <div class="category-box">
          <div class="category-step" id="category-step"></div>
          <div class="category-title" id="category-title"></div>
        </div>
        <div id="options-container">
          <p style="text-align:center;color:#999;">กำลังโหลดตัวเลือก...</p>
        </div>
        <div class="action-row">
          <button class="btn btn-secondary" id="step-back-btn" onclick="prevStep()">‹ ย้อนกลับ</button>
          <button class="btn btn-primary" id="step-next-btn" onclick="nextStep()" disabled>กรุณารอสักครู่...</button>
        </div>
      </div>

      <!-- หน้าสรุปก่อนส่ง -->
      <div id="summary-section" style="display:none;">
        <div class="summary-head">📋 ตรวจสอบผลโหวตของคุณ</div>
        <div id="summary-list"></div>
        <button class="btn btn-primary" id="submit-btn" onclick="submitVote()" disabled>กำลังเชื่อมต่อ LINE...</button>
      </div>
    </div>

    <div id="result"></div>
    <div id="debug"></div>
  </div>

<script>
  const LIFF_ID = "2012082491-YpjwjBHz";
  const API_URL = "https://script.google.com/macros/s/AKfycbwUPpLTyPmEX79TLEoo0xwhYnVR8JKQrDN_CbFY_qC6DWvbuQ9A7zUpo4L_yB3cwCkZ/exec";

  let idToken = null;
  let liffReady = false;
  let optionsLoaded = false;

  let categories = [];     // ชื่อรางวัล (มาจาก code.gs)
  let optionsData = [];    // ตัวเลือกชุด (ใช้ร่วมกันทุกรางวัล)
  let selections = [];     // index ของชุดที่เลือก แยกตามรางวัล
  let currentStep = 0;
  let currentIndex = 0;
  let editingFromSummary = false;
  let scrollTicking = false;

  function showDebug(msg) {
    document.getElementById("debug").innerText += "⚠️ " + msg + "\n";
  }
  window.onerror = (msg, src, line) => showDebug(msg + " (บรรทัด " + line + ")");

  window.onload = () => { initLiff(); loadOptions(); };

  async function initLiff() {
    try {
      if (typeof liff === "undefined") throw new Error("โหลด LIFF SDK ไม่สำเร็จ");
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      idToken = liff.getIDToken();
      if (!idToken) throw new Error("ไม่พบ ID Token (ตรวจว่าติ๊ก scope openid แล้ว)");
      const profile = await liff.getProfile();
      document.getElementById("user-info").innerText = "ผู้โหวต: " + profile.displayName;
      liffReady = true;
      updateSubmitButton();
    } catch (err) {
      document.getElementById("user-info").innerText = "❌ เชื่อมต่อ LINE ไม่สำเร็จ";
      showDebug("LIFF: " + err.message);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function loadOptions() {
    try {
      const res = await fetch(API_URL + "?action=options");
      const data = await res.json();
      const container = document.getElementById("options-container");

      categories = data.categories || [];
      const options = data.options || [];

      if (!categories.length) {
        container.innerHTML = "<p style='text-align:center;color:red;'>ไม่พบหัวข้อรางวัล (ตรวจว่า Deploy code.gs เวอร์ชันใหม่แล้ว)</p>";
        return;
      }
      if (!options.length) {
        container.innerHTML = "<p style='text-align:center;'>ยังไม่มีตัวเลือกในชีท Options</p>";
        return;
      }

      optionsData = options;
      selections = categories.map(() => null);
      renderCarousel(container, options);
      optionsLoaded = true;
      showStep(0);
    } catch (err) {
      document.getElementById("options-container").innerHTML =
        "<p style='color:red;text-align:center;'>โหลดตัวเลือกไม่สำเร็จ</p>";
      showDebug("Options: " + err.message);
    }
  }

  function renderCarousel(container, options) {
    let cardsHtml = "";
    let dotsHtml = "";
    options.forEach((opt, i) => {
      cardsHtml +=
        '<div class="vote-card" data-index="' + i + '">' +
          '<img src="' + escapeHtml(opt.image) + '" class="vote-img" alt="" loading="lazy">' +
          '<span class="vote-badge">' + (i + 1) + ' / ' + options.length + '</span>' +
          '<h3 class="vote-name">✨ ' + escapeHtml(opt.name) + '</h3>' +
        '</div>';
      dotsHtml += '<span class="dot" data-index="' + i + '"></span>';
    });

    container.innerHTML =
      '<div class="carousel-wrap">' +
        '<button class="nav-btn" id="prev-btn" aria-label="ก่อนหน้า">‹</button>' +
        '<div class="carousel" id="carousel">' + cardsHtml + '</div>' +
        '<button class="nav-btn" id="next-btn" aria-label="ถัดไป">›</button>' +
      '</div>' +
      '<div class="dots" id="dots">' + dotsHtml + '</div>';

    const carousel = document.getElementById("carousel");

    carousel.addEventListener("scroll", () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => { detectActive(); scrollTicking = false; });
    });

    carousel.querySelectorAll(".vote-card").forEach(card => {
      card.addEventListener("click", () => goTo(Number(card.dataset.index)));
    });
    document.querySelectorAll(".dot").forEach(dot => {
      dot.addEventListener("click", () => goTo(Number(dot.dataset.index)));
    });

    document.getElementById("prev-btn").onclick = () => goTo(currentIndex - 1);
    document.getElementById("next-btn").onclick = () => goTo(currentIndex + 1);

    window.addEventListener("resize", () => {
      if (document.getElementById("step-section").style.display !== "none") goTo(currentIndex, false);
    });
  }

  function detectActive() {
    const carousel = document.getElementById("carousel");
    if (!carousel || carousel.clientWidth === 0) return;
    const center = carousel.scrollLeft + carousel.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    carousel.querySelectorAll(".vote-card").forEach((card, i) => {
      const cardCenter = card.offsetLeft + card.offsetWidth / 2;
      const dist = Math.abs(cardCenter - center);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    if (best !== currentIndex) setActive(best);
  }

  function goTo(index, smooth = true) {
    if (index < 0 || index >= optionsData.length) return;
    const carousel = document.getElementById("carousel");
    const card = carousel.querySelectorAll(".vote-card")[index];
    const left = card.offsetLeft - (carousel.clientWidth - card.offsetWidth) / 2;
    carousel.scrollTo({ left: left, behavior: smooth ? "smooth" : "auto" });
    setActive(index);
  }

  function setActive(index) {
    currentIndex = index;
    selections[currentStep] = index;

    document.querySelectorAll(".vote-card").forEach((c, i) => c.classList.toggle("active", i === index));
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === index));
    document.getElementById("prev-btn").disabled = index === 0;
    document.getElementById("next-btn").disabled = index === optionsData.length - 1;
  }

  // ===== จัดการขั้นตอน (ทีละรางวัล) =====
  function showStep(step, fromSummary = false) {
    currentStep = step;
    editingFromSummary = fromSummary;

    document.getElementById("step-section").style.display = "block";
    document.getElementById("summary-section").style.display = "none";

    let segs = "";
    categories.forEach((c, i) => {
      const cls = i === step ? "current" : (selections[i] !== null ? "done" : "");
      segs += '<div class="step-seg ' + cls + '"></div>';
    });
    document.getElementById("stepper").innerHTML = segs;

    document.getElementById("category-step").innerText = "รางวัลที่ " + (step + 1) + " / " + categories.length;
    document.getElementById("category-title").innerText = "🏆 " + categories[step];

    const backBtn = document.getElementById("step-back-btn");
    backBtn.style.display = (step === 0 || fromSummary) ? "none" : "block";

    const nextBtn = document.getElementById("step-next-btn");
    nextBtn.disabled = !optionsLoaded;
    if (fromSummary) nextBtn.innerText = "บันทึกและกลับหน้าสรุป ›";
    else if (step === categories.length - 1) nextBtn.innerText = "ตรวจสอบผลโหวต ›";
    else nextBtn.innerText = "ถัดไป ›";

    const idx = selections[step] !== null ? selections[step] : 0;
    setActive(idx);
    requestAnimationFrame(() => goTo(idx, false));
    window.scrollTo(0, 0);
  }

  function nextStep() {
    if (editingFromSummary || currentStep === categories.length - 1) showSummary();
    else showStep(currentStep + 1);
  }

  function prevStep() {
    if (currentStep > 0) showStep(currentStep - 1);
  }

  function showSummary() {
    document.getElementById("step-section").style.display = "none";
    document.getElementById("summary-section").style.display = "block";

    let html = "";
    categories.forEach((cat, i) => {
      const opt = optionsData[selections[i]];
      html +=
        '<div class="summary-item">' +
          '<img class="summary-thumb" src="' + escapeHtml(opt ? opt.image : "") + '" alt="">' +
          '<div class="summary-text">' +
            '<div class="summary-cat">🏆 ' + escapeHtml(cat) + '</div>' +
            '<div class="summary-choice">' + (opt ? escapeHtml(opt.name) : "<span style='color:red'>ยังไม่ได้เลือก</span>") + '</div>' +
          '</div>' +
          '<button class="edit-btn" onclick="showStep(' + i + ', true)">แก้ไข</button>' +
        '</div>';
    });
    document.getElementById("summary-list").innerHTML = html;
    updateSubmitButton();
    window.scrollTo(0, 0);
  }

  function updateSubmitButton() {
    const btn = document.getElementById("submit-btn");
    if (liffReady && optionsLoaded) {
      btn.disabled = false;
      btn.innerText = "ส่งผลโหวตทั้ง " + categories.length + " รางวัล";
    } else {
      btn.disabled = true;
      btn.innerText = "กำลังเชื่อมต่อ LINE...";
    }
  }

  async function submitVote() {
    if (!liffReady || !idToken) return alert("ยังเชื่อมต่อ LINE ไม่สำเร็จ กรุณาเปิดผ่านแอป LINE");

    const missing = selections.findIndex(s => s === null);
    if (missing !== -1) {
      alert("กรุณาเลือกชุดในหัวข้อ \"" + categories[missing] + "\" ก่อนครับ");
      return showStep(missing, true);
    }

    const choices = selections.map(i => String(optionsData[i].name));
    const listText = categories.map((c, i) => "• " + c + ": " + choices[i]).join("\n");
    if (!confirm("ยืนยันผลโหวตใช่ไหมครับ?\n\n" + listText + "\n\n(ส่งได้เพียง 1 ครั้ง แก้ไขภายหลังไม่ได้)")) return;

    document.getElementById("vote-section").style.display = "none";
    document.getElementById("result").innerText = "กำลังบันทึกคะแนน...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ idToken: idToken, choices: choices })
      });
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("result").innerText = "✅ " + data.message;
      } else {
        document.getElementById("result").innerText = "⚠️ " + data.message;
        document.getElementById("vote-section").style.display = "block";
      }
    } catch (err) {
      document.getElementById("result").innerText = "";
      document.getElementById("vote-section").style.display = "block";
      showDebug("Vote: " + err.message);
    }
  }
</script>
</body>
</html>
