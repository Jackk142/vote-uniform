<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โหวตชุดแต่งกายประจำปี</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h1 { color: #06C755; text-align: center; font-size: 24px; margin: 8px 0; }
    .subtitle { text-align: center; color: #666; margin-bottom: 16px; }
    #user-info { background: #f1f3f5; border-radius: 10px; padding: 12px; text-align: center; font-weight: bold; margin-bottom: 16px; }

    /* ===== Carousel ===== */
    .carousel-wrap { position: relative; margin: 0 -20px 8px; }
    .carousel {
      position: relative;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 6px 9%;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    .vote-card {
      flex: 0 0 82%;
      scroll-snap-align: center;
      border: 3px solid #e9ecef;
      border-radius: 14px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
      opacity: .45;
      transform: scale(.92);
      transition: transform .25s, opacity .25s, border-color .25s, background .25s;
    }
    .vote-card.active {
      border-color: #06C755;
      background: #f4fbf7;
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 4px 14px rgba(6,199,85,.18);
    }
    .vote-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #f1f3f5;
      border-radius: 10px;
      display: block;
    }
    .vote-name { margin: 10px 0 0; font-size: 16px; text-align: center; color: #333; }

    .nav-btn {
      position: absolute; top: 45%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.95);
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      font-size: 22px; line-height: 38px; color: #06C755;
      cursor: pointer; z-index: 2; padding: 0;
    }
    .nav-btn:disabled { opacity: 0; pointer-events: none; }
    #prev-btn { left: 6px; }
    #next-btn { right: 6px; }

    .dots { display: flex; justify-content: center; gap: 6px; margin: 6px 0 4px; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d0d5da; cursor: pointer; transition: .2s; }
    .dot.active { background: #06C755; width: 20px; border-radius: 4px; }
    #counter { text-align: center; color: #888; font-size: 13px; margin-bottom: 14px; }
    .swipe-hint { text-align: center; color: #aaa; font-size: 12px; margin: 0 0 6px; }

    #submit-btn { width: 100%; padding: 14px; font-size: 18px; border: none; border-radius: 12px; background: #06C755; color: #fff; font-weight: bold; }
    #submit-btn:disabled { background: #ccc; }
    #result { text-align: center; font-size: 18px; margin-top: 16px; font-weight: bold; }
    #debug { color: red; font-size: 12px; white-space: pre-wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 โหวตชุดแต่งกายประจำปี</h1>
    <p class="subtitle">เลือกชุดที่คุณชื่นชอบที่สุดเพียง 1 สิทธิ์</p>
    <div id="user-info">กำลังเชื่อมต่อระบบ LINE...</div>

    <div id="vote-section">
      <div id="options-container">
        <p style="text-align:center;color:#999;">กำลังโหลดตัวเลือก...</p>
      </div>
      <button id="submit-btn" onclick="submitVote()" disabled>กรุณารอสักครู่...</button>
    </div>

    <div id="result"></div>
    <div id="debug"></div>
  </div>

<script>
  const LIFF_ID = "2012082491-YpjwjBHz";
  const API_URL = "https://script.google.com/macros/s/AKfycbwUPpLTyPmEX79TLEoo0xwhYnVR8JKQrDN_CbFY_qC6DWvbuQ9A7zUpo4L_yB3cwCkZ/exec";

  let idToken = null;
  let selectedChoice = "";
  let liffReady = false;
  let optionsLoaded = false;

  let optionsData = [];
  let currentIndex = 0;
  let scrollTicking = false;

  function showDebug(msg) {
    document.getElementById("debug").innerText += "⚠️ " + msg + "\n";
  }
  window.onerror = (msg, src, line) => showDebug(msg + " (บรรทัด " + line + ")");

  window.onload = () => { initLiff(); loadOptions(); };

  async function initLiff() {
    try {
      if (typeof liff === "undefined") throw new Error("โหลด LIFF SDK ไม่สำเร็จ");
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      idToken = liff.getIDToken();
      if (!idToken) throw new Error("ไม่พบ ID Token (ตรวจว่าติ๊ก scope openid แล้ว)");
      const profile = await liff.getProfile();
      document.getElementById("user-info").innerText = "ผู้โหวต: " + profile.displayName;
      liffReady = true;
      updateButton();
    } catch (err) {
      document.getElementById("user-info").innerText = "❌ เชื่อมต่อ LINE ไม่สำเร็จ";
      showDebug("LIFF: " + err.message);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function loadOptions() {
    try {
      const res = await fetch(API_URL + "?action=options");
      const options = await res.json();
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      if (!options.length) {
        container.innerHTML = "<p style='text-align:center;'>ยังไม่มีตัวเลือกในชีท Options</p>";
        return;
      }
      optionsData = options;
      renderCarousel(container, options);
      optionsLoaded = true;
      setActive(0);
    } catch (err) {
      document.getElementById("options-container").innerHTML =
        "<p style='color:red;text-align:center;'>โหลดตัวเลือกไม่สำเร็จ</p>";
      showDebug("Options: " + err.message);
    }
  }

  function renderCarousel(container, options) {
    let cardsHtml = "";
    let dotsHtml = "";
    options.forEach((opt, i) => {
      cardsHtml +=
        '<div class="vote-card" data-index="' + i + '">' +
          '<img src="' + escapeHtml(opt.image) + '" class="vote-img" alt="" loading="lazy">' +
          '<h3 class="vote-name">✨ ' + escapeHtml(opt.name) + '</h3>' +
        '</div>';
      dotsHtml += '<span class="dot" data-index="' + i + '"></span>';
    });

    container.innerHTML =
      '<p class="swipe-hint">👈 ปัดซ้าย-ขวาเพื่อเลือกชุด 👉</p>' +
      '<div class="carousel-wrap">' +
        '<button class="nav-btn" id="prev-btn" aria-label="ก่อนหน้า">‹</button>' +
        '<div class="carousel" id="carousel">' + cardsHtml + '</div>' +
        '<button class="nav-btn" id="next-btn" aria-label="ถัดไป">›</button>' +
      '</div>' +
      '<div class="dots" id="dots">' + dotsHtml + '</div>' +
      '<div id="counter"></div>';

    const carousel = document.getElementById("carousel");

    // ปัด/เลื่อน → หาการ์ดที่อยู่ตรงกลาง
    carousel.addEventListener("scroll", () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => { detectActive(); scrollTicking = false; });
    });

    // แตะการ์ด → เลื่อนมาตรงกลาง
    carousel.querySelectorAll(".vote-card").forEach(card => {
      card.addEventListener("click", () => goTo(Number(card.dataset.index)));
    });

    // แตะจุด
    document.querySelectorAll(".dot").forEach(dot => {
      dot.addEventListener("click", () => goTo(Number(dot.dataset.index)));
    });

    document.getElementById("prev-btn").onclick = () => goTo(currentIndex - 1);
    document.getElementById("next-btn").onclick = () => goTo(currentIndex + 1);

    // หมุนจอ/ปรับขนาด → จัดการ์ดเดิมให้อยู่กลาง
    window.addEventListener("resize", () => goTo(currentIndex, false));
  }

  function detectActive() {
    const carousel = document.getElementById("carousel");
    const center = carousel.scrollLeft + carousel.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    carousel.querySelectorAll(".vote-card").forEach((card, i) => {
      const cardCenter = card.offsetLeft + card.offsetWidth / 2;
      const dist = Math.abs(cardCenter - center);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    if (best !== currentIndex || !selectedChoice) setActive(best);
  }

  function goTo(index, smooth = true) {
    if (index < 0 || index >= optionsData.length) return;
    const carousel = document.getElementById("carousel");
    const card = carousel.querySelectorAll(".vote-card")[index];
    const left = card.offsetLeft - (carousel.clientWidth - card.offsetWidth) / 2;
    carousel.scrollTo({ left: left, behavior: smooth ? "smooth" : "auto" });
    setActive(index);
  }

  function setActive(index) {
    currentIndex = index;
    selectedChoice = String(optionsData[index].name);

    document.querySelectorAll(".vote-card").forEach((c, i) => c.classList.toggle("active", i === index));
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === index));
    document.getElementById("counter").innerText = (index + 1) + " / " + optionsData.length;
    document.getElementById("prev-btn").disabled = index === 0;
    document.getElementById("next-btn").disabled = index === optionsData.length - 1;

    updateButton();
  }

  function updateButton() {
    if (liffReady && optionsLoaded) {
      const btn = document.getElementById("submit-btn");
      btn.disabled = false;
      btn.innerText = selectedChoice ? "โหวต: " + selectedChoice : "ยืนยันการโหวต";
    }
  }

  async function submitVote() {
    if (!liffReady || !idToken) return alert("ยังเชื่อมต่อ LINE ไม่สำเร็จ กรุณาเปิดผ่านแอป LINE");
    if (!selectedChoice) return alert("กรุณาเลือกชุดที่ต้องการโหวตก่อนครับ");
    if (!confirm("ยืนยันโหวตให้ \"" + selectedChoice + "\" ใช่ไหมครับ?\n(โหวตได้เพียง 1 ครั้ง)")) return;

    document.getElementById("vote-section").style.display = "none";
    document.getElementById("result").innerText = "กำลังบันทึกคะแนน...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ idToken: idToken, choice: selectedChoice })
      });
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("result").innerText = "✅ " + data.message;
      } else {
        document.getElementById("result").innerText = "⚠️ " + data.message;
        document.getElementById("vote-section").style.display = "block";
      }
    } catch (err) {
      document.getElementById("result").innerText = "";
      document.getElementById("vote-section").style.display = "block";
      showDebug("Vote: " + err.message);
    }
  }
</script>
</body>
</html>
